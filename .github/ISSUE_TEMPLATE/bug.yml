name: Bug
description: Something in the Technical Preview does not match the documented behavior.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. This is a Technical Preview with a simulated Broker.

        **Never paste tokens, passwords, private keys, credentials, raw environment dumps, or private source.** Use hashes and redacted logs. Security-sensitive bypasses belong in a private report; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0-preview.3
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: Tarball SHA-256
      description: From SHA256SUMS or sha256sum / shasum -a 256 on the file you installed.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: OS and Node.js version
      placeholder: "Linux, Node 22.23.4"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Harmless local steps only. No real credentials and no writes to systems you do not own.
    validations:
      required: true
